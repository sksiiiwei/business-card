<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sksiiiwei</title>
  <meta name="description" content="Web and API pentesting, AI/ML security and DFIR. Findings, writeups and tools by sksiiiwei.">
  <meta name="theme-color" content="#1F2230">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/style.css">
  <script>
    /* Apply the saved theme before first paint to avoid a flash. */
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        var light = window.matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.setAttribute("data-theme", saved || (light ? "light" : "dark"));
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip" href="#main" data-i18n="skip">Skip to content</a>

  <div class="shell">
    <aside class="side">
      <a class="brand" href="#about">
        <span class="brand-name">sksiiiwei</span>
        <span class="brand-role" data-i18n="tagline">Pentest, AI/ML security, DFIR</span>
      </a>

      <nav class="tabs" id="tabs" aria-label="Sections">
        <a href="#about" data-tab="about"><span data-i18n="tabAbout">About / Skills</span></a>
        <a href="#writeups" data-tab="writeups"><span data-i18n="tabWriteups">Writeups</span><span class="count" id="count-writeups"></span></a>
        <a href="#utilities" data-tab="utilities"><span data-i18n="tabUtilities">Utilities</span><span class="count" id="count-utilities"></span></a>
        <a href="#certificates" data-tab="certificates"><span data-i18n="tabCerts">Certificates</span><span class="count" id="count-certificates"></span></a>
      </nav>

      <div class="side-foot">
        <ul class="links" id="links"></ul>
        <div class="controls">
          <button type="button" id="lang-btn" class="ctl" aria-label="Switch language">RU</button>
          <button type="button" id="theme-btn" class="ctl" aria-label="Switch theme" data-i18n="themeBtn">Light</button>
        </div>
      </div>
    </aside>

    <main id="main">
      <noscript><p class="noscript">This site needs JavaScript to show its content. Everything is also on <a href="https://github.com/sksiiiwei">github.com/sksiiiwei</a>.</p></noscript>
      <section class="panel" id="panel-about" data-panel="about" hidden></section>
      <section class="panel" id="panel-writeups" data-panel="writeups" hidden></section>
      <section class="panel" id="panel-utilities" data-panel="utilities" hidden></section>
      <section class="panel" id="panel-certificates" data-panel="certificates" hidden></section>
    </main>
  </div>

  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
